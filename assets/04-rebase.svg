<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="t d">
<title id="t">Skill 04 - Rebase</title>
<desc id="d">Animation: feature commits D and E are replayed on top of main&#x27;s latest commit C as new commits D-prime and E-prime; the old commits fade out; main then fast-forwards to E-prime.</desc>
<defs>
<radialGradient id="glowbg" cx="0.12" cy="0" r="0.75"><stop offset="0" stop-color="#bc8cff" stop-opacity="0.16"/><stop offset="1" stop-color="#bc8cff" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#30363d" opacity="0.55"/></pattern>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="card"><rect width="960" height="440" rx="16"/></clipPath>
<clipPath id="termclip"><rect x="588" y="72" width="348" height="272" rx="10"/></clipPath>
</defs>
