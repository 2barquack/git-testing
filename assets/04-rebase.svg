><g style="animation:k17 15s linear infinite"><rect x="619" y="171" width="348" height="19" fill="#010409"/><rect x="619" y="172" width="7.5" height="16" fill="#e6edf3" opacity="0.85"/></g></g><text x="604" y="206" class="mono" font-size="12.5" fill="#e6edf3" xml:space="preserve" style="animation:k18 15s cubic-bezier(.4,0,.2,1) infinite">Switched to branch 'main'</text><g style="animation:k19 15s cubic-bezier(.4,0,.2,1) infinite"><text x="604" y="227" class="mono" font-size="12.5" fill="#3fb950" font-weight="700">$</text><text x="620" y="227" class="mono" font-size="12.5" fill="#e6edf3" xml:space="preserve">git merge feature</text><g style="animation:k20 15s linear infinite"><rect x="619" y="213" width="348" height="19" fill="#010409"/><rect x="619" y="214" width="7.5" height="16" fill="#e6edf3" opacity="0.85"/></g></g><text x="604" y="248" class="mono" font-size="12.5" fill="#8b949e" xml:space="preserve" style="animation:k21 15s cubic-bezier(.4,0,.2,1) infinite">Updating 4b1f2a0..9c3e7d1</text><text x="604" y="269" class="mono" font-size="12.5" fill="#3fb950" xml:space="preserve" style="animation:k22 15s cubic-bezier(.4,0,.2,1) infinite">Fast-forward</text></g></g></g>
