<text x="48" y="78" class="sans" font-size="12.5" font-weight="800" letter-spacing="2.6" fill="url(#txtgrad)">HANDS-ON GIT LAB  ·  11 SKILLS  ·  .TXT FILES ONLY</text><text x="46" y="140" class="mono" font-size="56" font-weight="800" fill="#e6edf3" letter-spacing="-1">git-testing</text><rect x="420" y="98" width="24" height="48" rx="3" fill="#58a6ff" style="animation:k1 10s linear infinite"/><text x="48" y="178" class="sans" font-size="18.5" fill="#c9d1d9">Learn the Git skills every developer needs —</text><text x="48" y="204" class="sans" font-size="18.5" fill="#c9d1d9">by breaking (and fixing) a real repository.</text><g transform="translate(48,246)"><rect y="-13" width="68.5" height="26" rx="13" fill="#3fb950" stroke="#3fb950" style="animation:k2 10s cubic-bezier(.4,0,.2,1) infinite"/><text x="34.2" y="0.5" class="mono" font-size="12.5" font-weight="700" fill="#3fb950" text-anchor="middle" dominant-baseline="central">branch</text></g><g transform="translate(126.5,246)"><rect y="-13" width="60.8" height="26" rx="13" fill="#58a6ff" stroke="#58a6ff" style="animation:k3 10s cubic-bezier(.4,0,.2,1) infinite"/><text x="30.4" y="0.5" class="mono" font-size="12.5" font-weight="700" fill="#58a6ff" text-anchor="middle" dominant-baseline="central">merge</text></g><g transform="translate(197.25,246)"><rect y="-13" width="91.8" height="26" rx="13" fill="#f85149" stroke="#f85149" style="animation:k4 10s cubic-bezier(.4,0,.2,1) infinite"/><text x="45.9" y="0.5" class="mono" font-size="12.5" font-weight="700" fill="#f85149" text-anchor="middle" dominant-baseline="central">conflicts</text></g><g transform="translate(299.0,246)"><rect y="-13" width="68.5" height="26" rx="13" fill="#bc8cff" stroke="#bc8cff" style="animation:k5 10s cubic-bezier(.4,0,.2,1) infinite"/><text x="34.2" y="0.5" class="mono" font-size="12.5" font-weight="700" fill="#bc8cff" text-anchor="middle" dominant-baseline="central">rebase</text></g><g transform="translate(377.5,246)"><rect y="-13" width="68.5" heigh