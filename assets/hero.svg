<title id="t">git-testing - a hands-on Git lab</title>
<desc id="d">Banner: git-testing, a hands-on lab for the 10 Git skills every developer needs: branch, merge, conflicts, rebase, squash, stash, reset, revert, cherry-pick and reflog. An animated commit graph shows a branch being created and merged.</desc>
