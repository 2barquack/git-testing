="16.5" fill="#e6edf3" dominant-baseline="central" style="animation:k29 12s cubic-bezier(.4,0,.2,1) infinite">New commits move only the branch HEAD is on — <tspan fill="#58a6ff" font-weight="700">main</tspan> stays put.</text><text x="168" y="400" class="sans" font-size="16.5" fill="#e6edf3" dominant-baseline="central" style="animation:k30 12s cubic-bezier(.4,0,.2,1) infinite"><tspan class="mono" font-size="15" fill="#3fb950" font-weight="600">git switch main</tspan>&#8201; moves HEAD back, and your files follow.</text></g>
