<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="t d">
<title id="t">Skill 01 - Branch &amp; switch</title>
<desc id="d">Animation: git switch -c feature creates a new branch label at the current commit and moves HEAD onto it; new commits D and E advance only the feature branch; git switch main moves HEAD back.</desc>
