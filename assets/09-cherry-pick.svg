 font-size="16.5" fill="#e6edf3" dominant-baseline="central" style="animation:k28 14s cubic-bezier(.4,0,.2,1) infinite">…as a new commit E′ with a new hash. The original E stays on feature.</text><text x="168" y="400" class="sans" font-size="16.5" fill="#e6edf3" dominant-baseline="central" style="animation:k29 14s cubic-bezier(.4,0,.2,1) infinite">Tip: <tspan class="mono" font-size="15" fill="#ff7b72" font-weight="600">git cherry-pick -x</tspan>&#8201; records where the commit came from.</text></g>
